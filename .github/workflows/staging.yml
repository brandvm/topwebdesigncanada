name: Validate and deploy staging
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Build protected staging
        run: npm run build:staging && node scripts/verify.mjs && npm run test:staging
        env:
          BUILD_COMMIT: ${{ github.sha }}
          REVIEW_SCOPE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
      - uses: actions/upload-artifact@v4
        with:
          name: staging-build
          path: |
            dist/
            server/review-manifest.json
            reports/structure.json
          include-hidden-files: true
  deploy:
    needs: validate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: staging-build
      - name: Apply compatible database migrations
        if: github.event_name != 'pull_request'
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Update stable staging
        if: github.event_name != 'pull_request'
        run: npx wrangler deploy --var REVIEW_SCOPE:main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload protected pull-request preview
        if: github.event_name == 'pull_request'
        run: npx wrangler versions upload --preview-alias "$REVIEW_SCOPE" --var "REVIEW_SCOPE:$REVIEW_SCOPE" 2>&1 | tee preview.log
        env:
          REVIEW_SCOPE: pr-${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Record preview information
        if: always()
        run: |
          echo '### Protected staging' >> "$GITHUB_STEP_SUMMARY"
          echo 'Revision: `${{ github.sha }}`' >> "$GITHUB_STEP_SUMMARY"
          if [ -f preview.log ]; then cat preview.log >> "$GITHUB_STEP_SUMMARY"; fi
